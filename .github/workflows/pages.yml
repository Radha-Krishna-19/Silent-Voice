name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: frontend
        # PUBLIC_URL is set here, not in package.json's "homepage", so the
        # Docker/nginx build (which serves from "/") is unaffected — only
        # this Pages build is rooted at the "/Silent-Voice" subpath.
        # The backend runs on a Hugging Face Space (scripts/deploy_space.py);
        # its URL comes from the BACKEND_URL repository variable. Left unset,
        # the build falls back to localhost:8000 — only exported when set,
        # because an empty REACT_APP_BACKEND_URL means "same origin", which
        # on Pages would point at github.io.
        env:
          PUBLIC_URL: /Silent-Voice
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then export REACT_APP_BACKEND_URL="$BACKEND_URL"; fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
