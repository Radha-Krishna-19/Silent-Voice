name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        working-directory: backend
        run: pip install -r requirements-test.txt
      - name: test_auth.py
        working-directory: backend
        run: python test_auth.py
      - name: test_nlg.py
        working-directory: backend
        run: python test_nlg.py

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build + route/class/trail checks
        working-directory: frontend
        run: npm run verify

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t silent-voice-backend .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t silent-voice-frontend .
