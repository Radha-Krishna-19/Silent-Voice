services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      CORS_ORIGINS: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # SQLite accounts/transcripts/practice history survive a rebuild.
      - backend-data:/app/backend/data
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend-data:
