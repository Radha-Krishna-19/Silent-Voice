<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Silent Voice — Every gesture, heard.</title>
    <!--
      GitHub Pages serves this for any unknown path (e.g. a refresh on
      /live). It encodes the real path into a query string and redirects to
      the real index.html, which decodes it back before React Router mounts.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentsToKeep = 1; // keep "/Silent-Voice" as the app root
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/") + "/?" +
        l.pathname.slice(1).split("/").slice(segmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
