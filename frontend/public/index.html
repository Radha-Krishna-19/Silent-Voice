<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta
      name="description"
      content="Silent Voice — a real-time Indian Sign Language translator. Signers get captions and a voice; non-signers can reply back in sign."
    />
    <title>Silent Voice — Every gesture, heard.</title>

    <!--
      GitHub Pages has no server-side rewrite, so a deep link (e.g. /live)
      404s on refresh. 404.html redirects here with the real path encoded in
      the query string; this restores it via history.replaceState before
      React Router mounts. https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function () {
        var q = window.location.search;
        if (q[1] === "/") {
          var decoded = q
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(
            null,
            null,
            window.location.pathname.replace(/\/$/, "") + decoded + window.location.hash
          );
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Silent Voice requires JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
