server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router owns client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Proxy REST calls through to the backend container. Same-origin from the
    # browser's point of view — this is also the TLS termination boundary in
    # production (see ../DEPLOY.md): terminate HTTPS here, plain HTTP behind it.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket upgrade for /ws/frame — this is the piece a plain reverse
    # proxy config forgets. Without the Upgrade/Connection headers below,
    # nginx proxies it as a normal HTTP request and the handshake fails.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
